name: Bug or reproducibility failure
description: Something in the build-along code or verifier does not work as documented.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and the full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did the book say should happen?
      description: Give the chapter and, if possible, the claim ID from CLAIMS.md.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.14.4, torch 2.14.1+cpu, Linux"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I ran `python3 verify_book.py --check` and pasted its output.
          required: false
        - label: This is not a security issue (those go to research@twistpool.org).
          required: true
