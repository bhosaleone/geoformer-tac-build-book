name: Licensing question (public)
description: Ask about AGPL, CC BY-NC-SA, or attribution. For a commercial quote, email research@twistpool.org.
title: "[license] "
labels: [licensing]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the use case, not confidential business terms.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Answers here are general information, not legal advice. Requests for a
        commercial proprietary exemption must go to **research@twistpool.org**
        and are handled in private.
